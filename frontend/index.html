<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pushes</title>
    <link rel="preload" href="/fonts/Montserrat-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/LobsterTwo-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        min-height: 100dvh;
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #1a1a1a;
      }
      .boot__logo {
        font-size: 1.75rem;
        font-weight: 700;
      }
      .boot__spinner {
        width: 28px;
        height: 28px;
        border: 2px solid #ebebef;
        border-top-color: #ff6b00;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      html.app-ready #boot {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" aria-live="polite">
      <span class="boot__logo">Pushes</span>
      <span class="boot__spinner" aria-hidden></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
