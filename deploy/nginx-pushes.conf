# /etc/nginx/sites-available/pushes
server {
    listen 80;
    listen [::]:80;
    server_name pushes.su www.pushes.su;

    root /var/www/pushes;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
