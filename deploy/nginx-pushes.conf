# /etc/nginx/sites-available/pushes
# После правок: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name pushes.su www.pushes.su;

    root /var/www/pushes/frontend/dist;
    index index.html;

    # index.html — всегда свежий (иначе после деплоя «то грузится то нет»)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS с хешем в имени — можно кэшировать долго
    location /fonts/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# SSL (certbot добавит listen 443) — скопируй те же location в HTTPS-блок:
# certbot --nginx -d pushes.su -d www.pushes.su
